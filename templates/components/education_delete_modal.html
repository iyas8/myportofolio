<button type="button" class="button button-danger" popovertarget="delete-edu-{{ edu.id }}">
    Hapus
</button>

<div id="delete-edu-{{ edu.id }}" class="project-delete-modal" popover="auto" role="dialog" aria-modal="true">
    <button type="button" class="project-delete-modal__backdrop" popovertarget="delete-edu-{{ edu.id }}" popovertargetaction="hide"></button>
    <div class="project-delete-modal__content">
        <button type="button" class="project-delete-modal__close" popovertarget="delete-edu-{{ edu.id }}" popovertargetaction="hide">&times;</button>
        <h2>Hapus Riwayat?</h2>
        <p>Apakah Anda yakin ingin menghapus <strong>{{ edu.school }}</strong>?</p>
        <div class="project-delete-modal__actions">
            <button type="button" class="button button-secondary" popovertarget="delete-edu-{{ edu.id }}" popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_education' edu.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
